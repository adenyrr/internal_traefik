# Le templating est évalué par le provider File de Traefik.
http:
  middlewares:
    authentik:
      forwardAuth:
        address: '{{ env "AUTHENTIK_OUTPOST_URL" }}/outpost.goauthentik.io/auth/traefik'
        # Les en-têtes entrants sont filtrés par les trustedIPs de l'entrypoint.
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
  routers:
    authentik-callback:
      rule: 'Host(`{{ env "TRAEFIK_HOST" }}`) && PathPrefix(`/outpost.goauthentik.io/`)'
      entryPoints:
        - websecure
      service: authentik-outpost
      tls:
        certResolver: letsencrypt
  services:
    authentik-outpost:
      loadBalancer:
        servers:
          - url: '{{ env "AUTHENTIK_OUTPOST_URL" }}'
