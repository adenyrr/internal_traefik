name: traefik

services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    networks:
      - traefik
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro
      - ./data/traefik.yaml:/traefik.yaml:ro
      - ./data:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik-api.rule: "Host(`${TRAEFIK_HOST}`) && PathPrefix(`/api`)"
      traefik.http.routers.traefik-api.entrypoints: "websecure"
      traefik.http.routers.traefik-api.tls.certresolver: "internal"
      traefik.http.routers.traefik-api.service: "api@internal"

networks:
  traefik:
    name: traefik
    external: false